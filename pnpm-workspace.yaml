packages:
  - "apps/*"
  - "packages/*"

# Security floors for transitive deps (mirrors package.json "pnpm.overrides" — newer pnpm
# reads them from here instead). Keep both in sync until the package.json copy is dropped.
overrides:
  postcss: 8.5.19
  axios: ">=1.18.0"
  brace-expansion: ">=5.0.8"
  "@hono/node-server": ">=2.0.5"
  fast-uri: ^3.1.4
  sharp: ^0.35.0
