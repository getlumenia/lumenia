[package]
name = "lumen-drop"
version = "0.2.0"
edition = "2021"
description = "Lumenia v2 Soroban escrow — late-bound payout link drops + group drops (USDC via SAC)"
license = "MIT"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
soroban-sdk = "26.1.0"
stellar-access = "0.7.2"
stellar-contract-utils = "0.7.2"
stellar-macros = "0.7.2"

[dev-dependencies]
soroban-sdk = { version = "26.1.0", features = ["testutils"] }
ed25519-dalek = "2"
proptest = "1"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
