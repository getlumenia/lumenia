# cargo-vet baseline for the LumenDrop contract crate.
#
# `cargo vet init` snapshots the CURRENT dependency set as `[[exemptions]]` — that is a
# BASELINE, not an endorsement: it means "these crates were already here when auditing
# started", and `cargo vet` will now fail on any NEW or UPDATED dependency until it is
# audited or explicitly exempted. That is the value: it makes future supply-chain drift a
# visible, reviewable event.
#
# To import the public audit sets (Mozilla/Google/Bytecode Alliance) and shrink the
# exemption list, run:  cargo vet import mozilla google bytecode-alliance && cargo vet
#

# cargo-vet config file

