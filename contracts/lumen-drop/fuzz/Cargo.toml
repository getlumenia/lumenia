[package]
name = "lumen-drop-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
soroban-sdk = { version = "26.1.0", features = ["testutils"] }
ed25519-dalek = "2"

[dependencies.lumen-drop]
path = ".."

[[bin]]
name = "escrow_solvency"
path = "fuzz_targets/escrow_solvency.rs"
test = false
doc = false
bench = false
