[workspace]
resolver = "3"
members = ["contract", "test-usdc", "test-root"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"

# One release profile for every member: small, overflow-checked wasm.
[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
