[workspace]
resolver = "3"
members = ["contract", "test-usdc", "test-root"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"
# The public monorepo that holds this crate (contracts/lumen-drop-near). The escrow's NEP-330
# `contract_source_metadata` view returns it as `link`: cargo-near passes `package.repository` to the
# build as NEP330_LINK, so the URL is baked into the wasm and changing it changes the code hash.
repository = "https://github.com/getlumenia/lumenia"

[workspace.dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"

# One release profile for every member: small, overflow-checked wasm.
[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
