# The live claim regression, against the deployed testnet product.
#
# WHY THIS EXISTS. These specs were written months ago and ran in no workflow, because minting a
# claim link needed an issuer secret and CI has no secrets. So the only test covering the path a
# real recipient walks was one a person had to remember to run by hand, and the outage of 2026-08
# went nineteen days unnoticed for exactly that reason: the offline suites were green the whole
# time, because none of them submits a transaction.
#
# What changed: e2e/mintLink.ts now asks the sponsor's own /demo-link endpoint, the same one a
# visitor to /try uses. No key, no privileged access, and it tests the path a stranger takes
# rather than one only an operator can.
#
# NOT on every push, deliberately. It spends real testnet USDC from a rate-limited faucet and it
# depends on Horizon, so a red run here can mean "upstream had a bad minute" rather than "the
# product broke". Nightly plus on demand is the honest cadence for that, and it must never be the
# thing that blocks a merge.
name: Live claim regression

on:
  schedule:
    - cron: "23 5 * * *" # nightly, 05:23 UTC
  workflow_dispatch:
    inputs:
      web:
        description: "Web origin to test (default: production)"
        required: false
        default: "https://getlumenia.com"

concurrency:
  group: e2e-live
  cancel-in-progress: false

jobs:
  claim:
    name: Claim a real testnet link in a real browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install the browser
        run: pnpm --filter @lumenia/web exec playwright install --with-deps chromium
      # Only the claim spec. The others drive flows that need a funded account or a password the
      # suite would have to invent, and turning those on without thinking is how a nightly job
      # becomes noise that gets muted.
      - name: Live claim regression
        env:
          WEB_URL: ${{ inputs.web || 'https://getlumenia.com' }}
        run: pnpm --filter @lumenia/web exec playwright test e2e/claim.spec.ts --reporter=line
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  # A nightly job nobody reads is the failure mode this repository already lived through with the
  # weekly contract pass. One issue, updated, rather than a new one every morning.
  notify:
    name: Report a broken claim path
    needs: [claim]
    if: always() && needs.claim.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const title = "Live claim regression is failing";
            const body = [
              `The nightly live claim run failed on ${new Date().toISOString().slice(0, 10)}.`,
              "",
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "This test claims a real testnet link in a real browser, so a failure means either the",
              "deployed claim path is broken or an upstream (Horizon, the sponsor, the faucet) was",
              "unavailable. Check the attached report before assuming the first.",
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "live-claim",
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["live-claim"],
              });
            }
