# Weekly (and on-demand) DEEP security pass on the LumenDrop contract — the heavy tools that are
# too slow for the every-push gate in ci.yml: Scout (SARIF), OpenZeppelin soroban-scanner, and
# mutation testing. Results are uploaded as artifacts (Scout SARIF also feeds the Security tab).
# These are self-assessment tools — they are NOT an audit and are never described as one.

name: Contract security (deep)

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:

jobs:
  scout:
    name: Scout static analysis (SARIF)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/lumen-drop
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/lumen-drop
      - name: Cache cargo-installed binaries
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: cargo-bin-scout-${{ runner.os }}-v1
      - name: Install cargo-scout-audit
        run: command -v cargo-scout-audit || cargo install cargo-scout-audit --locked
      - name: Run Scout (SARIF + markdown)
        # Scout drives its own pinned nightly and defaults to wasm32-unknown-unknown, which
        # soroban-sdk 26 rejects (it requires wasm32v1-none). Pin the HOST target instead —
        # Scout's detectors are source-level, so the analysis is unaffected.
        env:
          CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
        run: |
          cargo scout-audit -o sarif --output-path scout.sarif || true
          cargo scout-audit -o md --output-path scout.md || true
          cargo scout-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scout-reports
          path: |
            contracts/lumen-drop/scout.sarif
            contracts/lumen-drop/scout.md

  soroban-scanner:
    name: OpenZeppelin soroban-scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build + run soroban-scanner
        run: |
          git clone --depth 1 https://github.com/OpenZeppelin/soroban-security-detectors-sdk /tmp/oz-scanner
          cargo build --release --manifest-path /tmp/oz-scanner/Cargo.toml --workspace
          SCANNER=$(find /tmp/oz-scanner/target/release -maxdepth 1 -type f -name "soroban-scanner" | head -1)
          "$SCANNER" scan contracts/lumen-drop/src | tee soroban-scanner.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soroban-scanner-report
          path: soroban-scanner.txt

  fuzz:
    name: Fuzzing (cargo-fuzz, solvency target)
    # Linux only: on macOS the ASan/cdylib link of soroban-sdk's ctor initializer fails, so
    # the fuzz target is a CI-only gate (the same solvency invariant also runs as a proptest
    # in `cargo test`, which does run everywhere).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/lumen-drop
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/lumen-drop
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Fuzz escrow solvency (10 minutes)
        run: cargo fuzz run escrow_solvency -- -max_total_time=600
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: contracts/lumen-drop/fuzz/artifacts

  mutants:
    name: Mutation testing (cargo-mutants)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/lumen-drop
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/lumen-drop
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Run mutants on the contract (proptest cases capped for speed)
        run: PROPTEST_CASES=16 cargo mutants -f src/lib.rs --timeout 120 -j 2 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-report
          path: contracts/lumen-drop/mutants.out
