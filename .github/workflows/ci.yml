name: CI

# Hermetic checks on every push + PR to main. Deliberately does NOT run the testnet-dependent
# suites (test:integration, Playwright e2e, the spikes) — those need friendbot + Horizon +
# USDC_ISSUER_SECRET and would be flaky/secret-dependent in CI. They stay as the local + post-deploy
# gates. Everything here passes offline: typecheck, the contract security gate (clippy strict + tests + audit/deny + coverage), the anti-drain validator (44/44, no network),
# a production web build, and the sponsor's esbuild Vercel bundle.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck + anti-drain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck — sponsor
        run: pnpm --filter @lumenia/sponsor exec tsc --noEmit
      - name: Typecheck — web
        run: pnpm --filter @lumenia/web exec tsc --noEmit
      - name: Anti-drain validator (44/44, no network)
        run: pnpm --filter @lumenia/sponsor test:antidrain

  build:
    name: Build web + sponsor bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Web production build (Next.js)
        run: pnpm --filter @lumenia/web build
      - name: Sponsor Vercel bundle (esbuild → api/*.js)
        run: pnpm --filter @lumenia/sponsor build:vercel

  contract:
    name: Contract — clippy strict + tests + audit + deny + coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/lumen-drop
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/lumen-drop
      - name: Clippy (strict — deny warnings + arithmetic/unwrap/panic lints)
        run: >
          cargo clippy --all-targets --
          -D warnings
          -W clippy::arithmetic_side_effects
          -W clippy::unwrap_used
          -W clippy::panic
      - name: Unit + invariant property tests
        run: cargo test
      - name: Install cargo-audit + cargo-deny + cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny,cargo-llvm-cov
      - name: cargo audit (RustSec advisories)
        run: cargo audit
      - name: cargo deny (advisories + licenses + bans + sources)
        run: cargo deny check
      - name: Coverage gate (lines ≥ 90%)
        run: cargo llvm-cov --fail-under-lines 90 --summary-only

  # A single required status to protect main against, if branch protection is ever turned on.
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [quality, build, contract]
    steps:
      - run: echo "All CI checks passed."
