name: CI

# Hermetic checks on every push + PR to main. Deliberately does NOT run the testnet-dependent
# suites (test:integration, test:watchdog, test:legacy, the concurrency tests, Playwright e2e, the
# spikes, the adversarial run) - those need friendbot + Horizon + keys and would be flaky or
# secret-dependent in CI. They stay as the local + post-deploy gates. Everything here passes
# offline: typecheck, the contract security gate (clippy strict + tests + audit/deny + coverage),
# the anti-drain validator, the other offline sponsor suites (kms / caps / channels / events /
# cctp / pilot / recovery-store / identity / identity-routes / soroban-relay / watchdog-offline),
# the web self-tests (recovery / claimpw / receive / horizon / claimerr / suggest / txguard /
# money / cctp-web / group / swap / extseam / walletkit / agentmcp / linkprivacy / claimmeta /
# claimledger / claimhome / pilotaccess), a production web build, and the browser extension (typecheck, its
# offline self-tests, the Chrome + Firefox build and the Firefox lint, with both zips kept as a
# build artifact). The `near` job at the end checks the NEAR rail (packages/near, the NEAR suites of
# web / sponsor / agent-market, and the escrow crate contracts/lumen-drop-near) beside all of this and is
# deliberately not part of ci-passed.
#
# "Hardening suite (D3 a-k)" is the SOW 2 D3 evidence step: it re-runs, under the name the SOW
# uses, exactly the suites that lock the open-mainnet hardening items (the item-to-suite table is
# in evidence/SOW2_READINESS_REPORT.md, section D3.2). All of them but `fake-kv --selftest` also run
# in the general steps above it; the duplicate run costs about a minute and makes the evidence
# findable on the run page by name.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The stellar CLI the two contract jobs build the wasm with: one release binary, sha256-pinned,
  # so the wasm build is the same on every runner and a CLI bump is a two-line change here. The
  # CLI stamps its own version into the wasm's contractmetav0 section (`cliver`), which is why the
  # sha256 of a build moves with the CLI version even when the code bytes do not. Linux x86_64
  # tarball of https://github.com/stellar/stellar-cli/releases/tag/v30.0.1 (2026-11-03).
  STELLAR_CLI_VERSION: "30.0.1"
  STELLAR_CLI_SHA256: "48c70074020e09af0a3ebbd2bf62d53c9aec47935e49a112d3cd90fb4e37658f"

jobs:
  quality:
    name: Typecheck + offline test suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck — sponsor
        run: pnpm --filter @lumenia/sponsor exec tsc --noEmit
      - name: Typecheck — web
        run: pnpm --filter @lumenia/web exec tsc --noEmit
      # Narrow on purpose — rules-of-hooks above all. A conditional useEffect on /send shipped a
      # white screen to production that typecheck and the Next build both passed happily.
      - name: Lint — web (react-hooks + next)
        run: pnpm --filter @lumenia/web lint --max-warnings 0
      - name: Anti-drain policy suite (no network)
        run: pnpm --filter @lumenia/sponsor test:antidrain
      # Every offline sponsor suite runs here, not just anti-drain — the recovery selftest
      # crash of 2026-08 stayed invisible for days precisely because CI only ran one suite.
      # Network-dependent suites (test:integration, test:watchdog, test:concurrency*) stay out.
      - name: Sponsor offline suites (kms + caps + channels + events + cctp + pilot + recovery-store + identity + identity-routes + soroban-relay + watchdog-offline)
        # The identity suites run against the in-memory store fallback: no KV_REST_API_* exists in
        # CI, so they cannot reach, let alone write to, the production registry.
        run: |
          pnpm --filter @lumenia/sponsor test:kms
          pnpm --filter @lumenia/sponsor test:caps
          pnpm --filter @lumenia/sponsor test:channels
          pnpm --filter @lumenia/sponsor test:events
          pnpm --filter @lumenia/sponsor test:cctp
          pnpm --filter @lumenia/sponsor test:pilot
          pnpm --filter @lumenia/sponsor test:recovery-store
          pnpm --filter @lumenia/sponsor test:identity
          pnpm --filter @lumenia/sponsor test:identity-routes
          pnpm --filter @lumenia/sponsor test:soroban-relay
          pnpm --filter @lumenia/sponsor test:watchdog-offline
      - name: Web self-tests (recovery + claimpw + receive + horizon + claimerr + suggest + txguard + money + cctp-web + group + swap + extseam + walletkit + agentmcp + linkprivacy + claimmeta + claimledger + claimhome + pilotaccess)
        run: |
          pnpm --filter @lumenia/web test:recovery
          pnpm --filter @lumenia/web test:claimpw
          pnpm --filter @lumenia/web test:receive
          pnpm --filter @lumenia/web test:horizon
          pnpm --filter @lumenia/web test:claimerr
          pnpm --filter @lumenia/web test:suggest
          pnpm --filter @lumenia/web test:txguard
          pnpm --filter @lumenia/web test:money
          pnpm --filter @lumenia/web test:cctp-web
          pnpm --filter @lumenia/web test:group
          pnpm --filter @lumenia/web test:swap
          pnpm --filter @lumenia/web test:extseam
          pnpm --filter @lumenia/web test:walletkit
          pnpm --filter @lumenia/web test:agentmcp
          # SOW 2 D2: what a claim link, its beacon and the claim routes' headers may reveal (the leak audit's offline half).
          pnpm --filter @lumenia/web test:linkprivacy
          pnpm --filter @lumenia/web test:claimmeta
          pnpm --filter @lumenia/web test:claimledger
          pnpm --filter @lumenia/web test:claimhome
          pnpm --filter @lumenia/web test:pilotaccess
      # SOW 2, D3 (open-mainnet readiness). One step, named as the SOW names it, listing the suites
      # that lock each hardening item (the same mapping as the table in the readiness report, D3.2):
      #   (a) relay simulation + fee bounds -> test:soroban-relay, test:cctp
      #   (b) the per-day sponsor fee budget -> test:caps, test:soroban-relay, test:cctp,
      #       test:antidrain, test:watchdog-offline
      #   (c) single-shot cap accounting -> test:soroban-relay, test:pilot
      #   (d) the per-share floor -> test:soroban-relay
      #   (e) the per-source onboarding budget -> test:caps
      #   (f) the watchdog heartbeat + auto-halt + the namespaced kill switch -> test:watchdog-offline
      #   (g) unconfirmed submissions (202, 503 busy) -> test:soroban-relay, test:cctp, and on the
      #       web test:claimerr, test:group, test:horizon, test:cctp-web, test:agentmcp
      #   (h) the KMS signer and the account/signer split -> test:kms, test:caps, test:cctp,
      #       test:antidrain
      #   (i) the retirement switch and the pilot slot residuals -> test:pilot, test:pilotaccess (web)
      #   (j) the refusals the adversarial run replays -> test:antidrain, and the stand-in store that
      #       run needs -> fake-kv --selftest
      #   (k) the per-sender cap -> test:caps
      # The extension's own suite also holds (g) and (i); it runs in its own job, not in this step.
      # The adversarial run itself needs a live Worker and is not in CI (its runs are in the
      # readiness report, D3.3).
      # `pnpm -C <dir> run <suite>`, not `pnpm --filter`: --filter exits 0 when the script does not
      # exist, so a renamed or dropped suite would leave this evidence step green; `run` exits 1.
      - name: Hardening suite (D3 a-k)
        run: |
          pnpm -C apps/sponsor run test:soroban-relay
          pnpm -C apps/sponsor run test:cctp
          pnpm -C apps/sponsor run test:caps
          pnpm -C apps/sponsor run test:watchdog-offline
          pnpm -C apps/sponsor run test:kms
          pnpm -C apps/sponsor run test:pilot
          pnpm -C apps/sponsor run test:antidrain
          pnpm -C apps/sponsor run fake-kv --selftest --quiet
          pnpm -C apps/web run test:claimerr
          pnpm -C apps/web run test:group
          pnpm -C apps/web run test:horizon
          pnpm -C apps/web run test:cctp-web
          pnpm -C apps/web run test:agentmcp
          pnpm -C apps/web run test:pilotaccess

  build:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Web production build (Next.js)
        run: pnpm --filter @lumenia/web build

  contract:
    name: Contract — clippy strict + tests + wasm build + audit + deny + coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/lumen-drop
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/lumen-drop
      - name: Clippy (strict — deny warnings + arithmetic/unwrap/panic lints)
        run: >
          cargo clippy --all-targets --
          -D warnings
          -W clippy::arithmetic_side_effects
          -W clippy::unwrap_used
          -W clippy::panic
      - name: Unit + invariant property tests
        run: cargo test
      - name: Install stellar-cli (the release binary pinned in env, sha256-checked)
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfL -o stellar-cli.tar.gz "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${STELLAR_CLI_SHA256}  stellar-cli.tar.gz" | sha256sum -c -
          mkdir -p stellar-cli && tar -xzf stellar-cli.tar.gz -C stellar-cli stellar
          echo "${RUNNER_TEMP}/stellar-cli" >> "$GITHUB_PATH"
          ./stellar-cli/stellar --version
      - name: Wasm build (stellar contract build --locked, wasm32v1-none)
        run: |
          stellar contract build --locked
          sha256sum target/wasm32v1-none/release/lumen_drop.wasm
      - name: Install cargo-audit + cargo-deny + cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny,cargo-llvm-cov
      - name: cargo audit (RustSec advisories)
        run: cargo audit
      - name: cargo deny (advisories + licenses + bans + sources)
        run: cargo deny check
      - name: Coverage gate (lines ≥ 90%)
        run: cargo llvm-cov --fail-under-lines 90 --summary-only

  # The testnet commitment spike (SOW 2, D2): a separate crate that is never deployed to mainnet. Its
  # tests are the wrong-reveal cases and the solvency property, so they run where anyone can see them.
  spike-contract:
    name: "Spike contract (testnet only): lumen-drop-commit tests + clippy"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/lumen-drop-commit
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/lumen-drop-commit
      - name: Clippy (strict, same flags as the escrow)
        run: >
          cargo clippy --all-targets --
          -D warnings
          -W clippy::arithmetic_side_effects
          -W clippy::unwrap_used
          -W clippy::panic
      - name: Tests (reveal, wrong reveals, solvency property)
        run: cargo test
      - name: Install stellar-cli (the release binary pinned in env, sha256-checked)
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfL -o stellar-cli.tar.gz "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${STELLAR_CLI_SHA256}  stellar-cli.tar.gz" | sha256sum -c -
          mkdir -p stellar-cli && tar -xzf stellar-cli.tar.gz -C stellar-cli stellar
          echo "${RUNNER_TEMP}/stellar-cli" >> "$GITHUB_PATH"
          ./stellar-cli/stellar --version
      - name: Wasm build (stellar contract build --locked, wasm32v1-none)
        run: |
          stellar contract build --locked
          sha256sum target/wasm32v1-none/release/lumen_drop_commit.wasm

  # The browser extension (SOW 2, D1). Everything here is offline: the self-tests fake the Soroban
  # RPC, the sponsor and the recovery server, and need no keys. The zips are kept so a reviewer can
  # install exactly what CI built.
  extension:
    name: "Extension: typecheck + selftests + build + Firefox lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck - extension
        run: pnpm --filter @lumenia/extension exec tsc --noEmit
      - name: Self-tests - extension (url + links + send + session + restore + security + router + account + popup)
        run: pnpm --filter @lumenia/extension test
      - name: Build - extension (Chrome + Firefox)
        run: pnpm --filter @lumenia/extension build
      - name: Lint - Firefox build (web-ext)
        run: pnpm --filter @lumenia/extension lint:firefox
      - uses: actions/upload-artifact@v7
        with:
          name: lumenia-extension-zips
          path: apps/extension/dist/*.zip
          if-no-files-found: error

  # The NEAR rail (the 2026 NEAR hackathon work: packages/near, the NEAR suites of web + sponsor,
  # apps/agent-market and the escrow crate contracts/lumen-drop-near). Deliberately independent: no
  # `needs:` and NOT in ci-passed, so a NEAR failure never blocks the Stellar jobs and the other way
  # round. Offline except for two pinned downloads the sandbox tests need on a cold cache: the cargo-near
  # release (the tests build the three wasm files through `cargo near build`) and the near-sandbox binary
  # (nearcore 2.14.0), which near-sandbox fetches once into its build-script OUT_DIR under the crate's
  # target/, so rust-cache keeps it together with ~/.cargo. Locally the same set is `pnpm near:verify:offline`.
  near:
    name: "NEAR rail: near package + web/sponsor/agent-market suites + escrow crate (tests + clippy)"
    runs-on: ubuntu-latest
    env:
      # Linux x86_64 tarball of https://github.com/near/cargo-near/releases/tag/cargo-near-v0.23.0
      # (2026-11-05), the version the crate's README records; the sha256 is the release's own .sha256 file.
      CARGO_NEAR_VERSION: "0.23.0"
      CARGO_NEAR_SHA256: "94008b827a457750257eced4b571c33736062cc3bd1ffda3e7af70e2bc9a4073"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # `pnpm -C <dir> run <script>`, not `--filter`: --filter exits 0 when the script does not exist (see
      # the hardening step above), and two of these scripts live in packages the NEAR work only borrows.
      - name: Typecheck - near package (the library, then its tests)
        run: |
          pnpm -C packages/near run typecheck
          pnpm -C packages/near exec tsc --noEmit -p tsconfig.test.json
      - name: Self-tests - near package (amount + base58 + batch + budget + link + lumenia + near + oneclick + payout-csv + receipts + store + relayer policy / caps / round trip)
        run: pnpm -C packages/near run test
      - name: NEAR suites - web (test:near) + sponsor (test:near-relay)
        run: |
          pnpm -C apps/web run test:near
          pnpm -C apps/sponsor run test:near-relay
      - name: Agent Market worker - tests + build
        run: |
          pnpm -C apps/agent-market run test
          pnpm -C apps/agent-market run build
      # The crate pins its toolchain in rust-toolchain.toml (1.95.0 + clippy + wasm32-unknown-unknown); the
      # channel is read from that file so the two cannot drift.
      - name: Read the escrow crate's pinned toolchain (rust-toolchain.toml)
        id: near-toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' contracts/lumen-drop-near/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.near-toolchain.outputs.channel }}
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/lumen-drop-near
      - name: Install cargo-near (the release binary pinned in env, sha256-checked)
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfL -o cargo-near.tar.gz "https://github.com/near/cargo-near/releases/download/cargo-near-v${CARGO_NEAR_VERSION}/cargo-near-x86_64-unknown-linux-gnu.tar.gz"
          echo "${CARGO_NEAR_SHA256}  cargo-near.tar.gz" | sha256sum -c -
          mkdir -p cargo-near && tar -xzf cargo-near.tar.gz -C cargo-near --strip-components=1 cargo-near-x86_64-unknown-linux-gnu/cargo-near
          echo "${RUNNER_TEMP}/cargo-near" >> "$GITHUB_PATH"
          ./cargo-near/cargo-near near --version
      - name: Escrow crate - clippy (deny warnings)
        working-directory: contracts/lumen-drop-near/contract
        run: cargo clippy --all-targets -- -D warnings
      - name: Escrow crate - unit + sandbox tests (43 + 21; near-sandbox downloads nearcore 2.14.0 on a cold cache)
        working-directory: contracts/lumen-drop-near/contract
        run: cargo test

  # A single required status to protect main against, if branch protection is ever turned on.
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [quality, build, contract, spike-contract, extension]
    steps:
      - run: echo "All CI checks passed."
